.fc .em{font-size:40px;line-height:1.1}.fc b{font-family:"Nunito",system-ui,sans-serif;font-size:17px;margin-top:4px}

.fc .ct{font-weight:800;font-size:14px;color:var(--ink);background:rgba(242,169,0,.22);border-radius:99px;padding:3px 10px;margin-bottom:10px}

</style>
</head>

 S.pay.forEach(x=>{if(x.id==null)x.id=nid()});S.id=S.id||1;S.rno=S.rno||1;S.seed=1}

 $('as').innerHTML=sel('Class','s1',S.cfg.cl,ac,'onchange="ac=this.value;render()"')+sel('Assessment','s2',AP,at,'onchange="at=this.value;render()"')+sel('Subject','s3',sj,asj,'onchange="asj=this.value;render()"')+'<div class="sm" id="avg"></div><div class="sm">'+at+' counts '+W()[at]+'% of the final result for the term.</div>'+(l.map(p=>`<div class="line"><div class="nm"><b>${esc(p.name)}</b></div><input type="number" inputmode="decimal" placeholder="/100" value="${sc(p.id,at)[asj]??''}" onchange="ss(${p.id},this.value)"></div>`).join('')||'<div class="empty">No pupils in this class yet.</div>');avg()}

function recData(){const T=[...new Set([TK(),...Object.values(S.sc).flatMap(o=>Object.keys(o)),...S.dl.map(l=>l.tk)])].sort().reverse();if(!T.includes(rt))rt=T.includes(TK())?TK():T[0];if(!S.cfg.cl.includes(rcl))rcl=S.cfg.cl[0];
 const L=S.p.filter(p=>p.cls===rcl).sort((a,b)=>a.name.localeCompare(b.name)),E=p=>{const o={};subs(rcl).forEach(s=>{const f=sfin(p.id,rt,s);if(f!=null)o[s]=Math.round(f)});return o},A=p=>fin(p,rt),m=L.filter(x=>A(x)!=null);
 return{T,L,E,A,sj:subs(rcl),rk:p=>{const a=A(p);return a==null?'-':(1+m.filter(x=>A(x)>a).length)+'/'+m.length}}}

 $('as').innerHTML=sel('Term','r1',d.T.map(k=>[k,tlab(k)]),rt,'onchange="rt=this.value;render()"')+sel('Class','r2',S.cfg.cl,rcl,'onchange="rcl=this.value;render()"')+`<div class="sm">Final result = ${AP.map(x=>x[0]+' '+W()[x[0]]+'%').join(' + ')} (change in Settings). Pupils are listed in their current class. Tap a pupil for their history over all terms.</div><div style="overflow-x:auto"><table><tr><th>Pupil</th>${d.sj.map(s=>`<th>${esc(ab(s))}</th>`).join('')}<th>Avg</th><th>Gr</th><th>Pos</th></tr>${d.L.map(p=>`<tr onclick="ah(${p.id})"><td>${esc(p.name)}</td>${d.sj.map(s=>`<td>${d.E(p)[s]??'-'}</td>`).join('')}<td><b>${d.A(p)==null?'-':Math.round(d.A(p))}</b></td><td>${gr(d.A(p))}</td><td>${d.rk(p)}</td></tr>`).join('')||'<tr><td colspan="9">No pupils in this class yet.</td></tr>'}</table></div><div class="sm">${esc(abLeg(d.sj))}</div>${btn('Copy results','copy(rectx())','big')}<h3>Exam papers and records (Google Drive)</h3><div class="sm">Upload scanned papers or mark sheets to your school Google Drive, then save the link here for ${tlab(rt)}.</div>`+(links.map(l=>`<div class="line"><div class="nm"><b>${esc(l.title)}</b><br><small>${esc(l.cls||'All classes')}</small></div><a href="${esc(l.url)}" target="_blank" rel="noopener"><b>Open</b></a> <button class="chip" onclick="dlf(${l.id})">Edit</button></div>`).join('')||'<div class="sm">No links saved for this term yet.</div>')+btn('Add Google Drive link','dlf(0)')+'<a class="btn" href="https://drive.google.com" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;color:inherit">Open Google Drive</a>'+btn('Export results (PDF / CSV)',"xo('results')")}

function dlf(id){const l=id?S.dl.find(x=>x.id===id):{title:'',url:'',cls:''};show(`<h2>${id?'Edit link':'New Google Drive link'}</h2><div class="sm">For ${tlab(rt)}. Share the Drive file or folder first so the right people can open it.</div>${fld('Title (e.g. P.5 End of term exams)','d1',l.title)}${fld('Link (https://drive.google.com/...)','d2',l.url,'url')}${sel('Class','d3',[['','All classes'],...S.cfg.cl],l.cls||'')}${btn('Save link','sdl('+id+')','big')}${id?btn('Delete link','ddl('+id+')','del'):''}${btn('Cancel','cm()')}`)}
function sdl(id){const t=$('d1').value.trim(),u=$('d2').value.trim();if(!t)return toast('Enter a title');if(!/^https:\/\/\S+$/i.test(u))return toast('The link must start with https://');const d={title:t.slice(0,120),url:u.slice(0,500),cls:$('d3').value,tk:rt};id?Object.assign(S.dl.find(x=>x.id===id),d):S.dl.push({id:nid(),...d});save();cm();render()}

function ah(id){const p=P(id),T=[...new Set([TK(),...Object.keys(S.sc[id]||{})])].sort().reverse(),a=(k,per)=>{const v=Object.values(scK(id,k,per));return v.length?sum(v,x=>+x)/v.length:null},f=v=>v==null?'-':Math.round(v),fn=k=>{const q={...p};return fin(q,k)};
 show(`<h2>${esc(p.name)}</h2><small>Academic history</small><table><tr><th>Term</th><th>BOT</th><th>MID</th><th>EOT</th><th>Final</th><th>Gr</th></tr>${T.map(k=>`<tr><td>${tlab(k)}</td><td>${f(a(k,'BOT'))}</td><td>${f(a(k,'MID'))}</td><td>${f(a(k,'EOT'))}</td><td><b>${f(fn(k))}</b></td><td>${gr(fn(k))}</td></tr>`).join('')}</table><div class="sm">Averages across all subjects. Final uses the weights in Settings and the pupil's current class subjects.</div>${btn('Close','cm()')}`)}
function aRep(){if(!S.cfg.cl.includes(ac))ac=S.cfg.cl[0];$('as').innerHTML=sel('Class','s1',S.cfg.cl,ac,'onchange="ac=this.value;render()"')+S.p.filter(p=>p.cls===ac).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<button class="item" onclick="rcard(${p.id})"><span class="nm"><b>${esc(p.name)}</b><small>${AP.map(a=>{const v=av(p,a[0]);return a[0]+' '+(v==null?'-':Math.round(v))}).join(' | ')} | Final ${fin(p,TK())==null?'-':Math.round(fin(p,TK()))} (${gr(fin(p,TK()))})</small></span></button>`).join('')||'<div class="empty">No pupils in this class yet.</div>'}
function rcard(id){const p=P(id),sj=subs(p.cls),w=W(),tk=TK(),r=(per,s)=>sc(id,per)[s]??'-',a=fin(p,tk),part=sj.some(s=>sfin(id,tk,s)!=null&&!comp(id,tk,s));
 show(`<h2>${esc(p.name)}</h2><small>${esc(p.cls)}, ${TL()}</small><table><tr><th>Subject</th>${AP.map(x=>`<th>${x[0]}<br><small>${w[x[0]]}%</small></th>`).join('')}<th>Final</th><th>Gr</th></tr>${sj.map(s=>{const f=sfin(id,tk,s);return `<tr><td>${esc(s)}</td>${AP.map(x=>`<td>${r(x[0],s)}</td>`).join('')}<td><b>${f==null?'-':Math.round(f)}</b></td><td>${gr(f)}</td></tr>`}).join('')}<tr><td><b>Average</b></td>${AP.map(x=>{const v=av(p,x[0]);return `<td>${v==null?'-':Math.round(v)}</td>`}).join('')}<td><b>${a==null?'-':Math.round(a)}</b></td><td><b>${gr(a)}</b></td></tr><tr><td>Position</td><td colspan="3"></td><td colspan="2"><b>${posF(p,tk)}</b></td></tr></table><div class="sm">Final result = ${AP.map(x=>x[0]+' '+w[x[0]]+'%').join(' + ')}.${a==null?'':' Overall: '+grr(a)+'.'}${part?' Provisional: some assessments are not entered yet.':''} Grades: ${GS().map(g=>g.g+' '+g.m+'+').join(', ')}.</div><label>Class teacher's comment</label><textarea id="cmt" rows="3">${esc(S.cm[id+TK()]||'')}</textarea>${btn('Save comment and copy report','scm('+id+')','big')}${btn('Close','cm()')}`)}
function scm(id){const p=P(id),sj=subs(p.cls),tk=TK(),a=fin(p,tk),w=W();S.cm[id+TK()]=$('cmt').value.trim();save();copy(`${SN().toUpperCase()}\n${S.cfg.desc?S.cfg.desc+'\n':''}Report: ${p.name}, ${p.cls}, ${TL()}\n`+sj.map(s=>{const f=sfin(id,tk,s);return s+': '+AP.map(x=>x[0]+' '+(sc(id,x[0])[s]??'-')).join(', ')+' | Final '+(f==null?'-':Math.round(f))+' ('+gr(f)+')'}).join('\n')+`\nFinal result (${AP.map(x=>x[0]+' '+w[x[0]]+'%').join(', ')}): average ${a==null?'-':Math.round(a)}, grade ${gr(a)}${a==null?'':' ('+grr(a)+')'}, position ${posF(p,tk)}`+(S.cm[id+TK()]?'\nTeacher comment: '+S.cm[id+TK()]:''))}

function tv(id){const t=TC(id),pw='style="white-space:pre-wrap"';show(`<h2>${esc(t.name)}</h2>${kv('Status',esc(t.qual||'-'))}${kv('Role / responsibility',esc(t.role||'-'))}${kv('Phone',t.tel?`<a href="tel:${esc(t.tel.replace(/\s/g,''))}">${esc(t.tel)}</a>`:'-')}${kv('NIN',esc(t.nin||'-'))}${kv('MoES registration no.',esc(t.reg||'-'))}${kv('Classes taught',esc(arr(t.cls).join(', ')||'-'))}${kv('Subjects taught',esc(t.sj||'-'))}${kv('Monthly salary',t.sal?money(t.sal):'-')}<h3>Working experience</h3><div class="sm" ${pw}>${esc(t.exp||'-')}</div><h3>Other qualifications</h3><div class="sm" ${pw}>${esc(t.oq||'-')}</div>${btn('Appraisal',`ap(${id},'BOT')`,'big')}${btn('Edit teacher','et('+id+')')}${btn('Close','cm()')}`)}

function et(id){const t=id?TC(id):{name:'',tel:'',nin:'',reg:'',qual:QUAL[0],role:'',cls:[],sj:'',exp:'',oq:''},all=allSj(),have=String(t.sj||'').split(',').map(x=>x.trim()).filter(Boolean),oth=have.filter(x=>!all.includes(x)).join(', ');
 show(`<h2>${id?'Edit staff member':'New teacher or staff member'}</h2>${fld('Full name','e1',t.name)}${fld('Phone','e2',t.tel,'tel')}${fld('National Identification Number (NIN)','e3',t.nin||'')}${fld('Registration number (Ministry of Education and Sports)','e4',t.reg||'')}${sel('Status','e5',QUAL,t.qual||QUAL[0])}${fld('Role / responsibility in the school (e.g. Deputy head, Class teacher, Games)','e6',t.role||'')}<label>Classes taught (tick all)</label>${chk('tcl',S.cfg.cl,arr(t.cls))}<label>Subjects taught (tick all)</label>${chk('tsj',all,have)}${fld('Other subjects (separate with commas)','e7',oth)}${fld('Monthly salary in UGX (for payroll, optional)','e10',t.sal||'','number')}<label>Working experience</label><textarea id="e8" rows="3" placeholder="Schools and years, e.g. Arua Primary 2015 to 2020">${esc(t.exp||'')}</textarea><label>Other qualifications</label><textarea id="e9" rows="3" placeholder="e.g. Diploma in Early Childhood, Certificate in ICT">${esc(t.oq||'')}</textarea>${btn('Save teacher','st('+id+')','big')}${id?btn('Delete teacher','dt('+id+')','del'):''}${btn('Cancel','cm()')}`)}
function st(id){const n=$('e1').value.trim();if(!n)return toast('Enter the teacher name');const nin=$('e3').value.trim().toUpperCase().replace(/\s/g,'');
 if(nin&&S.t.some(x=>x.id!==id&&String(x.nin||'').toUpperCase()===nin))return toast('That NIN is already recorded for another teacher');
 if(nin&&!/^[A-Z0-9]{14}$/.test(nin)&&!confirm('A NIN normally has 14 letters and numbers. Save it anyway?'))return;
 const sj=[...ticked('tsj'),...$('e7').value.split(',').map(x=>x.trim()).filter(Boolean)].join(', '),d={name:n,tel:$('e2').value.trim(),nin,reg:$('e4').value.trim(),qual:$('e5').value,role:$('e6').value.trim(),cls:ticked('tcl'),sj,exp:$('e8').value.trim(),oq:$('e9').value.trim(),sal:+$('e10').value||0};

'cm()')}`)}
function scf(){const c=S.cfg,w={BOT:+$('w1').value||0,MID:+$('w2').value||0,EOT:+$('w3').value||0};
 if(w.BOT<0||w.MID<0||w.EOT<0||w.BOT+w.MID+w.EOT!==100)return toast('The three weights must add up to 100 (now '+(w.BOT+w.MID+w.EOT)+')');
 const gs=[];for(const ln of $('gs').value.split('\n')){if(!ln.trim())continue;const q=ln.split(','),m=parseFloat(q[0]),g=(q[1]||'').trim();if(isNaN(m)||m<0||m>100||!g)return toast('Check the grading line: '+ln.trim().slice(0,30));if(gs.some(x=>x.m===m))return toast('Two grades start at '+m);gs.push({m,g:g.slice(0,6),r:q.slice(2).join(',').trim().slice(0,30)})}
 if(!gs.some(x=>x.m===0))return toast('Add a grade for 0 (the lowest mark), e.g. 0, E, Fail');c.w=w;c.gs=gs;c.tm={...TM(),st:$('tm0').value||'08:00'};c.dp={};c.cl.forEach((cn,i)=>{const v=$('dp'+i);if(v&&v.value)c.dp[cn]=v.value});c.exc=$('c7').value.trim();
 const l=$('c6').value.split(',').map(s=>s.trim()).filter(Boolean);c.name=$('c0').value.trim().slice(0,120);c.desc=$('c0d').value.trim().slice(0,400);c.year=+$('c1').value||c.year;c.term=+$('c2').value;c.subN=$('c3').value;c.subP=$('c4').value;c.ab=$('c8').value.slice(0,1500);c.crit=$('c5').value;if(l.length)c.cl=l;save();if(window.schSyncProfile)window.schSyncProfile();cm();render()}

 S=o;mig();save();cm();render();toast('Backup restored')}catch(e){toast('That is not a valid backup')}}
